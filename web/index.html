<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graph M4ker</title>
  <meta name="description" content="Grafos y algoritmos de ordenamiento implementados en Dart.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="app">

    <!-- Páginas de cada método (se generan desde app.js) -->
    <div id="paginas"></div>

    <main class="root" id="inicio">
      <header class="hero">
        <h1 class="title">Graph M4ker</h1>
        <p class="byline">by Windows98</p>
      </header>

      <section class="wrap" aria-label="Conceptos">
        <div class="acc-list" id="conceptos"></div>
      </section>

      <section class="algos" aria-labelledby="algos-h">
        <div class="wrap">
          <h2 id="algos-h" class="algos-title">ALGORITMOS Y ORDENAMIENTOS</h2>
        </div>
        <div class="rail" id="tarjetas"></div>
      </section>
    </main>

    <noscript><p class="wrap">Esta página necesita JavaScript para mostrar su contenido.</p></noscript>
  </div>

  <script src="app.js"></script>
</body>
</html>
