name: graph_maker_app_2
description: "Graph M4ker - Editor de grafos y algoritmos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  shared_preferences: ^2.2.3
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.2.2
  flutter_colorpicker: ^1.1.0
  tutorial_coach_mark: ^1.3.4
  pdfrx: ^2.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/docs/app_knowledge.md
    - assets/images/graph_maket.png
    - assets/docs/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/graph_maket.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/graph_maket.png"
  windows:
    generate: true
    image_path: "assets/images/graph_maket.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/graph_maket.png"